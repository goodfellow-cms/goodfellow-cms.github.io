<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Goodfellow CMS has moved</title>
    <!-- Any other address on the domain, such as /docs/blocks or /robots.txt, goes to the same address at
         goodfellowcms.com, whose own "Page not found" shows if it has no such page. Without JavaScript, its home page. -->
    <script>location.replace("https://goodfellowcms.com" + location.pathname + location.search + location.hash);</script>
    <meta http-equiv="refresh" content="0; url=https://goodfellowcms.com/" />
  </head>
  <body>
    <p>Goodfellow CMS has moved to <a href="https://goodfellowcms.com/">goodfellowcms.com</a>.</p>
  </body>
</html>
