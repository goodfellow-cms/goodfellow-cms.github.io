<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Goodfellow CMS</title>
    <!-- An address on the domain itself, such as a link missing the documentation's folder (/docs/…), goes to the same
         address in the documentation, whose own "Page not found" shows if it has no such page. -->
    <script>location.replace("https://goodfellow-cms.github.io/goodfellow-cms" + location.pathname + location.search + location.hash);</script>
  </head>
  <body>
    <p>There's no page here. <a href="https://goodfellow-cms.github.io/goodfellow-cms/">Goodfellow CMS's documentation</a> is at goodfellow-cms.github.io/goodfellow-cms/.</p>
  </body>
</html>
